name: Keep Render Awake

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend health endpoint
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          test -n "$RENDER_BACKEND_URL" || {
            echo "::error::RENDER_BACKEND_URL repository secret is not configured."
            exit 1
          }
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 60 \
            "${RENDER_BACKEND_URL%/}/health"
